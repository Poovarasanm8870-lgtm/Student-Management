<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Student-Management/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraSMS | Next-Gen Student Management System</title>
    <meta name="description" content="Premium Student Management System with role-based dashboards for Admin, Teacher, and Parents." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Inline critical styles: prevents white flash before CSS bundle loads -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        min-height: 100vh;
        background: #020617;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }

      /* Loading spinner — shown until React mounts and removes it */
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: #020617;
        transition: opacity 0.4s ease;
      }
      #app-loader.fade-out { opacity: 0; pointer-events: none; }

      .loader-logo {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        animation: pulse-logo 2s ease-in-out infinite;
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
      }
      .loader-logo svg { width: 28px; height: 28px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .loader-text {
        font-size: 22px; font-weight: 800;
        background: linear-gradient(90deg, #fff, #a5b4fc, #7c3aed);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
      }
      .loader-sub { font-size: 13px; color: #64748b; font-weight: 500; margin-top: -10px; }

      .loader-dots { display: flex; gap: 6px; }
      .loader-dots span {
        width: 7px; height: 7px; border-radius: 50%; background: #6366f1;
        animation: bounce-dot 1.2s infinite ease-in-out;
      }
      .loader-dots span:nth-child(1) { animation-delay: 0s; }
      .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(99,102,241,0.4); }
        50% { transform: scale(1.06); box-shadow: 0 0 50px rgba(99,102,241,0.6); }
      }
    </style>
    <script type="module" crossorigin src="/Student-Management/assets/index-C28tBO3Y.js"></script>
    <link rel="stylesheet" crossorigin href="/Student-Management/assets/index-Bxq1Zwu8.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="app-loader">
      <div class="loader-logo">
        <svg viewBox="0 0 24 24">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div>
        <div class="loader-text">AuraSMS</div>
        <div class="loader-sub">Next-Gen Academic Dashboard</div>
      </div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>

    <!-- Remove loader once React has mounted -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('app-loader');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function () { loader.remove(); }, 450);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
